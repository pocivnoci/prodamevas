<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Disable font cache to avoid "No writable cache directories" error on Vercel -->
  <cachedir>/tmp/fontconfig-cache</cachedir>
  
  <!-- Add font directory -->
  <dir>.</dir>
  
  <!-- Match Inter fonts -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Inter</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Inter</string>
    </edit>
  </match>
</fontconfig>
