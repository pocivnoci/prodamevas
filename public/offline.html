<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>Chrlit — bez připojení</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      background: #050505;
      color: #f4f1f0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .card { max-width: 340px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
    img { height: 32px; opacity: 0.9; }
    h1 {
      font-size: 12px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;
      margin: 0; color: #e5533f;
    }
    p { margin: 0; font-size: 14px; line-height: 1.6; color: #9d9492; }
    button {
      margin-top: 4px;
      background: #e5533f; color: #fff; border: none; border-radius: 2px;
      padding: 13px 26px; font: inherit;
      font-size: 10px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;
      cursor: pointer;
    }
    button:hover { background: #d14b38; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/chrlit-logo-transparent.svg" alt="Chrlit" />
    <h1>Bez připojení</h1>
    <p>
      Chrlit potřebuje internet — texty i obrázky vznikají na serveru, ne v telefonu.
      Jakmile budete zpátky online, pokračujte tam, kde jste skončili.
    </p>
    <button onclick="location.reload()">Zkusit znovu</button>
  </div>
  <script>
    // Jakmile se síť vrátí, vrátíme člověka do aplikace bez ťukání.
    addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
